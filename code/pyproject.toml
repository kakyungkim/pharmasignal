[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharmasignal"
version = "0.1.0"
description = "신약 안전성·경쟁 신호 감시 에이전트 (Agent Forge Seoul)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
sandbox = ["daytona>=0.100"]
dev = ["pytest>=8.0"]

[project.scripts]
pharmasignal = "pharmasignal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmasignal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
